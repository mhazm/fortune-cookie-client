name: Release Nismara Companion & Tracker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag version for this release (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'macos-latest'
            args: ''
            target: 'aarch64-apple-darwin'
          - platform: 'macos-13'
            args: ''
            target: 'x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'nismara-companion/package-lock.json'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'nismara-companion/src-tauri -> target'

      # Ensure companion resources folder and placeholder DLL exist across all platforms
      - name: Prepare Companion resources directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "nismara-companion/resources"
          if (!(Test-Path "nismara-companion/resources/NismaraTracker.dll")) {
            New-Item -ItemType File -Force -Path "nismara-companion/resources/NismaraTracker.dll"
          }

      # Linux-specific build dependencies for Tauri v2
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Windows-specific step: Build native C++ NismaraTracker.dll and bundle into Companion
      - name: Build NismaraTracker.dll (Windows x64)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          New-Item -ItemType Directory -Force -Path "nismara-companion/resources"
          if (Test-Path "bin/Release/NismaraTracker.dll") {
            Copy-Item -Path "bin/Release/NismaraTracker.dll" -Destination "nismara-companion/resources/NismaraTracker.dll" -Force
          } elseif (Test-Path "bin/NismaraTracker.dll") {
            Copy-Item -Path "bin/NismaraTracker.dll" -Destination "nismara-companion/resources/NismaraTracker.dll" -Force
          }
          Write-Host "Successfully compiled NismaraTracker.dll and copied to resources."

      - name: Install frontend dependencies
        working-directory: ./nismara-companion
        run: npm ci

      - name: Build Tauri Application & Generate Auto-Update Assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./nismara-companion
          tagName: ${{ github.ref_name || inputs.release_tag }}
          releaseName: 'Nismara Companion ${{ github.ref_name || inputs.release_tag }}'
          releaseBody: |
            Official Release of Nismara Companion & NismaraTracker In-Game Plugin.
            
            ### Included Components:
            - **Nismara Companion Desktop App** (Windows `.exe`, Linux `.AppImage` / `.deb`, macOS `.dmg`)
            - **NismaraTracker.dll** (In-Game C++ Telemetry Plugin for ETS2 & ATS)
            
            ### Auto-Update:
            Existing desktop installations will automatically detect and install this release via GitHub CDN.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Upload standalone NismaraTracker.dll directly as GitHub Release Asset
      - name: Upload standalone NismaraTracker.dll to Release
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ inputs.release_tag }}" }
          if (Test-Path "bin/Release/NismaraTracker.dll") {
            gh release upload "$tag" "bin/Release/NismaraTracker.dll" --clobber
            Write-Host "Uploaded standalone NismaraTracker.dll to release $tag"
          } elseif (Test-Path "bin/NismaraTracker.dll") {
            gh release upload "$tag" "bin/NismaraTracker.dll" --clobber
            Write-Host "Uploaded standalone NismaraTracker.dll to release $tag"
          }

